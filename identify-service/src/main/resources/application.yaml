server:
  port: 8100
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
spring:
  application:
    name: identify-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identify_service}
    username: postgres
    password: 12345678
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: create
              create-target: schema.sql
    show-sql: true
